<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="monospace">
  <rect width="600" height="400" fill="#1a1b2e" rx="8"/>
  <!-- ESP32 -->
  <rect x="30" y="100" width="160" height="200" fill="#2d4a3e" rx="6" stroke="#64ffda" stroke-width="1.5"/>
  <text x="50" y="130" fill="#64ffda" font-size="13" font-weight="bold">ESP32</text>
  <line x1="50" y1="140" x2="170" y2="140" stroke="#3a5a4e" stroke-width="1"/>
  <!-- GPIO pins labelled inside ESP32 -->
  <text x="50" y="165" fill="#8892b0" font-size="9">GPIO25  ─ R1</text>
  <text x="50" y="180" fill="#8892b0" font-size="9">GPIO26  ─ G1</text>
  <text x="50" y="195" fill="#8892b0" font-size="9">GPIO27  ─ B1</text>
  <text x="50" y="215" fill="#8892b0" font-size="9">GPIO14  ─ R2</text>
  <text x="50" y="230" fill="#8892b0" font-size="9">GPIO12  ─ G2</text>
  <text x="50" y="245" fill="#8892b0" font-size="9">GPIO13  ─ B2</text>
  <text x="50" y="265" fill="#8892b0" font-size="9">GPIO23  ─ A</text>
  <text x="50" y="280" fill="#8892b0" font-size="9">GPIO22  ─ B</text>
  <text x="110" y="165" fill="#8892b0" font-size="9">GPIO5   ─ C</text>
  <text x="110" y="180" fill="#8892b0" font-size="9">GPIO17  ─ D</text>
  <text x="110" y="195" fill="#8892b0" font-size="9">GPIO32  ─ E</text>
  <text x="110" y="215" fill="#8892b0" font-size="9">GPIO16  ─ CLK</text>
  <text x="110" y="230" fill="#8892b0" font-size="9">GPIO4   ─ LAT</text>
  <text x="110" y="245" fill="#8892b0" font-size="9">GPIO15  ─ OE</text>
  <!-- Wires going to matrix -->
  <line x1="190" y1="130" x2="280" y2="100" stroke="#ff6b6b" stroke-width="1"/>
  <line x1="190" y1="150" x2="280" y2="120" stroke="#69db7c" stroke-width="1"/>
  <line x1="190" y1="170" x2="280" y2="140" stroke="#74c0fc" stroke-width="1"/>
  <line x1="190" y1="190" x2="280" y2="160" stroke="#ff6b6b" stroke-width="1"/>
  <line x1="190" y1="210" x2="280" y2="180" stroke="#69db7c" stroke-width="1"/>
  <line x1="190" y1="230" x2="280" y2="200" stroke="#74c0fc" stroke-width="1"/>
  <line x1="190" y1="250" x2="280" y2="220" stroke="#e6f1ff" stroke-width="1"/>
  <line x1="190" y1="270" x2="280" y2="240" stroke="#e6f1ff" stroke-width="1"/>
  <line x1="190" y1="290" x2="280" y2="260" stroke="#e6f1ff" stroke-width="1"/>
  <line x1="190" y1="250" x2="300" y2="280" stroke="#e6f1ff" stroke-width="1"/>
  <line x1="190" y1="270" x2="300" y2="300" stroke="#e6f1ff" stroke-width="1"/>
  <!-- Matrix panel -->
  <rect x="280" y="60" width="300" height="300" fill="#0d1117" rx="4" stroke="#30363d" stroke-width="2"/>
  <!-- Grid of pixels -->
  <g opacity="0.6">
    <rect x="295" y="75" width="8" height="8" fill="#ff6b6b" rx="1"/>
    <rect x="310" y="75" width="8" height="8" fill="#ff6b6b" rx="1"/>
    <rect x="325" y="75" width="8" height="8" fill="#69db7c" rx="1"/>
    <rect x="340" y="75" width="8" height="8" fill="#74c0fc" rx="1"/>
    <rect x="355" y="75" width="8" height="8" fill="#69db7c" rx="1"/>
    <rect x="370" y="75" width="8" height="8" fill="#e6f1ff" rx="1"/>
    <rect x="385" y="75" width="8" height="8" fill="#ff6b6b" rx="1"/>
    <rect x="295" y="90" width="8" height="8" fill="#e6f1ff" rx="1"/>
    <rect x="310" y="90" width="8" height="8" fill="#74c0fc" rx="1"/>
    <rect x="325" y="90" width="8" height="8" fill="#ff6b6b" rx="1"/>
    <rect x="340" y="90" width="8" height="8" fill="#69db7c" rx="1"/>
    <rect x="355" y="90" width="8" height="8" fill="#e6f1ff" rx="1"/>
    <rect x="370" y="90" width="8" height="8" fill="#ff6b6b" rx="1"/>
    <rect x="385" y="90" width="8" height="8" fill="#74c0fc" rx="1"/>
    <rect x="295" y="105" width="8" height="8" fill="#69db7c" rx="1"/>
    <rect x="310" y="105" width="8" height="8" fill="#ff6b6b" rx="1"/>
    <rect x="325" y="105" width="8" height="8" fill="#e6f1ff" rx="1"/>
    <rect x="340" y="105" width="8" height="8" fill="#74c0fc" rx="1"/>
    <rect x="355" y="105" width="8" height="8" fill="#69db7c" rx="1"/>
    <rect x="370" y="105" width="8" height="8" fill="#69db7c" rx="1"/>
    <rect x="385" y="105" width="8" height="8" fill="#e6f1ff" rx="1"/>
  </g>
  <!-- Triangle glowing -->
  <polygon points="340,180 295,260 385,260" fill="none" stroke="#64ffda" stroke-width="2" opacity="0.8"/>
  <polygon points="340,185 300,255 380,255" fill="none" stroke="#64ffda" stroke-width="1" opacity="0.3"/>
  <text x="290" y="340" fill="#64ffda" font-size="11" font-weight="bold">64×64 HUB75 Matrix</text>
  <!-- Labels -->
  <text x="20" y="380" fill="#ff6b6b" font-size="9">R1/R2</text>
  <text x="80" y="380" fill="#69db7c" font-size="9">G1/G2</text>
  <text x="140" y="380" fill="#74c0fc" font-size="9">B1/B2</text>
  <text x="200" y="380" fill="#e6f1ff" font-size="9">A/B/C/D/E</text>
  <text x="310" y="380" fill="#64ffda" font-size="9">CLK/LAT/OE</text>
</svg>
