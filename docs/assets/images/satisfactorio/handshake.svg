     pagecolor="#ffffff"
     bordercolor="#000000"
     borderopacity="0.25"
     inkscape:showpageshadow="2"
     inkscape:pageopacity="0.0"
     inkscape:pagecheckerboard="0"
     inkscape:deskcolor="#d1d1d1"
     inkscape:zoom="1.3695542"
     inkscape:cx="200.79527"
     inkscape:cy="164.28704"
     inkscape:window-width="1614"
     inkscape:window-height="981"
     inkscape:window-x="66"
     inkscape:window-y="32"
     inkscape:window-maximized="1"
     inkscape:current-layer="svg18" />
  <defs
     id="defs2">
    <linearGradient
       id="bg"
       x1="0%"
       y1="0%"
       x2="100%"
       y2="100%">
      <stop
         offset="0%"
         style="stop-color:#1e1e2e"
         id="stop1" />
      <stop
         offset="100%"
         style="stop-color:#181825"
         id="stop2" />
    </linearGradient>
    <filter
       id="shadow"
       x="-5%"
       y="-5%"
       width="110%"
       height="110%">
      <feDropShadow
         dx="0"
         dy="2"
         stdDeviation="3"
         flood-color="#000"
         flood-opacity="0.3" />
    </filter>
  </defs>
  <rect
     width="400"
     height="380"
     rx="12"
     fill="url(#bg)"
     id="rect2" />
  <text
     x="200"
     y="35"
     text-anchor="middle"
     fill="#cdd6f4"
     font-size="14"
     font-weight="600"
     id="text2">Handshake client-serveur</text>
  <!-- Client vertical line -->
  <line
     x1="100"
     y1="73.619202"
     x2="100"
     y2="350.18256"
     stroke="#89b4fa"
     stroke-width="1.45237"
     id="line2" />
  <rect
     x="60"
     y="45"
     width="80"
     height="28"
     rx="6"
     fill="#89b4fa"
     opacity="0.2"
     id="rect3" />
  <text
     x="100"
     y="64"
     text-anchor="middle"
     fill="#89b4fa"
     font-size="12"
     font-weight="600"
     id="text3">CLIENT</text>
  <!-- Server vertical line -->
  <line
     x1="300"
     y1="74.166824"
     x2="300"
     y2="350"
     stroke="#a6e3a1"
     stroke-width="1.45045"
     id="line3" />
  <rect
     x="260"
     y="45"
     width="80"
     height="28"
     rx="6"
     fill="#a6e3a1"
     opacity="0.2"
     id="rect4" />
  <text
     x="300"
     y="64"
     text-anchor="middle"
     fill="#a6e3a1"
     font-size="12"
     font-weight="600"
     id="text4">SERVEUR</text>
  <!-- Step 1: server_id (server -> client) -->
  <line
     x1="300"
     y1="105"
     x2="100"
     y2="105"
     stroke="#f38ba8"
     stroke-width="1.5"
     marker-end="url(#arrowRed)"
     id="line4" />
  <text
     x="200"
     y="97"
     text-anchor="middle"
     fill="#f38ba8"
     font-size="10"
     id="text5">16 bytes: server_id</text>
  <text
     x="200"
     y="118"
     text-anchor="middle"
     fill="#6c7086"
     font-size="9"
     id="text6">EN CLAIR</text>
  <!-- Step 2: Handshake (client -> server) -->
  <line
     x1="100"
     y1="155"
     x2="300"
     y2="155"
     stroke="#89b4fa"
     stroke-width="1.5"
     marker-end="url(#arrowBlue)"
     id="line6" />
  <text
     x="200"
     y="147"
     text-anchor="middle"
     fill="#89b4fa"
     font-size="10"
     id="text7">{version, username}</text>
  <text
     x="200"
     y="168"
     text-anchor="middle"
     fill="#6c7086"
     font-size="9"
     id="text8">CHIFFRÉ AES-256-GCM</text>
  <!-- Step 3: HandshakeAck (server -> client) -->
  <line
     x1="300"
     y1="215"
     x2="100"
     y2="215"
     stroke="#a6e3a1"
     stroke-width="1.5"
     marker-end="url(#arrowGreen)"
     id="line8" />
  <text
     x="200"
     y="207"
     text-anchor="middle"
     fill="#a6e3a1"
     font-size="10"
     id="text9">{player_id, server_time}</text>
  <text
     x="200"
     y="228"
     text-anchor="middle"
     fill="#6c7086"
     font-size="9"
     id="text10">CHIFFRÉ AES-256-GCM</text>
  <!-- Step 4: ServerSeed (server -> client) -->
  <line
     x1="300"
     y1="275"
     x2="100"
     y2="275"
     stroke="#f9e2af"
     stroke-width="1.5"
     marker-end="url(#arrowYellow)"
     id="line10" />
  <text
     x="200"
     y="267"
     text-anchor="middle"
     fill="#f9e2af"
     font-size="10"
     id="text11">{seed: u32}</text>
  <text
     x="200"
     y="288"
     text-anchor="middle"
     fill="#6c7086"
     font-size="9"
     id="text12">CHIFFRÉ AES-256-GCM</text>
  <!-- After handshake label -->
  <rect
     x="60"
     y="310"
     width="280"
     height="28"
     rx="6"
     fill="#45475a"
     id="rect12" />
  <text
     x="200"
     y="329"
     text-anchor="middle"
     fill="#cdd6f4"
     font-size="11"
     id="text13">Communication chiffrée continue</text>
  <!-- Labels -->
  <text
     x="50"
     y="160"
     fill="#89b4fa"
     font-size="10"
     id="text14">envoie</text>
  <text
     x="310"
     y="110"
     fill="#a6e3a1"
     font-size="10"
     id="text15">génère</text>
  <defs
     id="defs18">
    <marker
       id="arrowRed"
       markerWidth="8"
       markerHeight="6"
       refX="8"
       refY="3"
       orient="auto">
      <path
         d="M0,0 L8,3 L0,6 Z"
         fill="#f38ba8"
         id="path15" />
    </marker>
    <marker
       id="arrowBlue"
       markerWidth="8"
       markerHeight="6"
       refX="8"
       refY="3"
       orient="auto">
      <path
         d="M0,0 L8,3 L0,6 Z"
         fill="#89b4fa"
         id="path16" />
    </marker>
    <marker
       id="arrowGreen"
       markerWidth="8"
       markerHeight="6"
       refX="8"
       refY="3"
       orient="auto">
      <path
         d="M0,0 L8,3 L0,6 Z"
         fill="#a6e3a1"
         id="path17" />
    </marker>
    <marker
       id="arrowYellow"
       markerWidth="8"
       markerHeight="6"
       refX="8"
       refY="3"
       orient="auto">
      <path
         d="M0,0 L8,3 L0,6 Z"
         fill="#f9e2af"
         id="path18" />
    </marker>
  </defs>
</svg>
