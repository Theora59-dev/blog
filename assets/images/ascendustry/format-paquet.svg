<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   viewBox="0 0 600 280"
   font-family="system-ui, -apple-system, sans-serif"
   version="1.1"
   id="svg14"
   sodipodi:docname="format-paquet.svg"
   inkscape:version="1.4.3 (0d15f75042, 2025-12-25)"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <sodipodi:namedview
     id="namedview14"
     pagecolor="#ffffff"
     bordercolor="#000000"
     borderopacity="0.25"
     inkscape:showpageshadow="2"
     inkscape:pageopacity="0.0"
     inkscape:pagecheckerboard="0"
     inkscape:deskcolor="#d1d1d1"
     inkscape:zoom="3.7173614"
     inkscape:cx="162.48084"
     inkscape:cy="209.55724"
     inkscape:window-width="1614"
     inkscape:window-height="981"
     inkscape:window-x="66"
     inkscape:window-y="32"
     inkscape:window-maximized="1"
     inkscape:current-layer="svg14" />
  <defs
     id="defs2">
    <linearGradient
       id="bg"
       x1="0%"
       y1="0%"
       x2="100%"
       y2="100%">
      <stop
         offset="0%"
         style="stop-color:#1e1e2e"
         id="stop1" />
      <stop
         offset="100%"
         style="stop-color:#181825"
         id="stop2" />
    </linearGradient>
    <filter
       id="shadow"
       x="-0.0083333333"
       y="-0.016666667"
       width="1.0166667"
       height="1.0333333">
      <feDropShadow
         dx="0"
         dy="2"
         stdDeviation="3"
         flood-color="#000"
         flood-opacity="0.3" />
    </filter>
  </defs>
  <rect
     width="600"
     height="280"
     rx="12"
     fill="url(#bg)"
     id="rect2" />
  <text
     x="300"
     y="35"
     text-anchor="middle"
     fill="#cdd6f4"
     font-size="14"
     font-weight="600"
     id="text2">Format d'un paquet sur le réseau</text>
  <!-- Main packet layout -->
  <text
     x="50"
     y="80"
     fill="#6c7086"
     font-size="11"
     id="text3">Sur le wire :</text>
  <!-- Size header -->
  <rect
     x="50"
     y="100"
     width="120"
     height="60"
     rx="6"
     fill="#313244"
     stroke="#f9e2af"
     stroke-width="2"
     filter="url(#shadow)"
     id="rect3" />
  <text
     x="110"
     y="125"
     text-anchor="middle"
     fill="#f9e2af"
     font-size="12"
     font-weight="600"
     id="text4">4 bytes</text>
  <text
     x="110"
     y="145"
     text-anchor="middle"
     fill="#6c7086"
     font-size="10"
     id="text5">big-endian</text>
  <!-- Payload -->
  <rect
     x="170"
     y="100"
     width="380"
     height="60"
     rx="6"
     fill="#313244"
     stroke="#89b4fa"
     stroke-width="2"
     filter="url(#shadow)"
     id="rect5" />
  <text
     x="360"
     y="125"
     text-anchor="middle"
     fill="#89b4fa"
     font-size="12"
     font-weight="600"
     id="text6">N bytes</text>
  <text
     x="360"
     y="145"
     text-anchor="middle"
     fill="#6c7086"
     font-size="10"
     id="text7">AES-256-GCM encrypted payload</text>
  <!-- Arrow from main to decrypted -->
  <line
     x1="360"
     y1="160"
     x2="360"
     y2="185"
     stroke="#6c7086"
     stroke-width="1"
     marker-end="url(#arrowGray)"
     id="line7" />
  <text
     x="375"
     y="178"
     fill="#6c7086"
     font-size="9"
     id="text8">déchiffré + désérialisé</text>
  <!-- Decrypted view -->
  <rect
     x="120"
     y="190"
     width="440"
     height="70"
     rx="8"
     fill="#313244"
     stroke="#a6e3a1"
     stroke-width="1.5"
     filter="url(#shadow)"
     stroke-dasharray="4,2"
     id="rect8" />
  <text
     x="340"
     y="215"
     text-anchor="middle"
     fill="#a6e3a1"
     font-size="11"
     font-weight="600"
     id="text9">Paquet désérialisé (bincode)</text>
  <!-- Fields -->
  <rect
     x="140"
     y="225"
     width="100"
     height="28"
     rx="4"
     fill="#45475a"
     id="rect9" />
  <text
     x="190"
     y="244"
     text-anchor="middle"
     fill="#cdd6f4"
     font-size="10"
     id="text10">TypePaquet</text>
  <rect
     x="248"
     y="225"
     width="100"
     height="28"
     rx="4"
     fill="#45475a"
     id="rect10" />
  <text
     x="298"
     y="244"
     text-anchor="middle"
     fill="#cdd6f4"
     font-size="10"
     id="text11">Données</text>
  <rect
     x="356"
     y="225"
     width="80"
     height="28"
     rx="4"
     fill="#45475a"
     id="rect11" />
  <text
     x="396"
     y="244"
     text-anchor="middle"
     fill="#cdd6f4"
     font-size="10"
     id="text12">Timestamp</text>
  <rect
     x="444"
     y="225"
     width="100"
     height="28"
     rx="4"
     fill="#45475a"
     id="rect12" />
  <text
     x="494"
     y="244"
     text-anchor="middle"
     fill="#cdd6f4"
     font-size="10"
     id="text13">MAC (GCM tag)</text>
  <!-- Max size label -->
  <rect
     x="109.18176"
     y="176.45619"
     width="100"
     height="24"
     rx="12"
     fill="#45475a"
     id="rect13" />
  <text
     x="159.18176"
     y="193.45619"
     text-anchor="middle"
     fill="#f38ba8"
     font-size="10px"
     id="text14">max: 65 536 bytes</text>
  <defs
     id="defs14">
    <marker
       id="arrowGray"
       markerWidth="8"
       markerHeight="6"
       refX="8"
       refY="3"
       orient="auto">
      <path
         d="M0,0 L8,3 L0,6 Z"
         fill="#6c7086"
         id="path14" />
    </marker>
  </defs>
</svg>
