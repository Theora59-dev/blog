site_name: Theora59-dev Blog
theme:
  name: material
  features:
    - navigation.instant
    - content.code.copy
nav:
  - Accueil: index.md
  - À propos: a-propos.md
  - DVWA: dvwa.md
  - FFMPEG Commands: cours/ffmpeg-cheatsheet.md
  - Git Commands: cours/git.md
  - Assembler MIPS: cours/assembler-MIPS.md
  - Librairie BMP: projets/bmp-image-manager.md
  - Projet Saturne: projets/simple-planet-gen/index.md
  - Ascendustry - Réseau & Chiffrement: projets/ascendustry-reseau-chiffrement.md
  - Ascendustry - Avancées récentes: projets/ascendustry-avancees.md
  - Driver HUB75 pour matrice LED: projets/driver-hub75.md
  - La gestion d'erreurs en Rust: cours/rust-errors.md

markdown_extensions:
  - pymdownx.highlight:
      use_pygments: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
